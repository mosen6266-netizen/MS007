name: Deploy MS007 to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "src/**"
      - "schema.sql"
      - "wrangler.toml"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOOTSTRAP_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve or create D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest d1 list --json > /tmp/d1-list.json
          DB_ID=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/d1-list.json','utf8'));const a=Array.isArray(x)?x:(x.result||[]);const d=a.find(v=>v.name==='ms007-crm');if(d)process.stdout.write(d.uuid||d.id||'')")
          if [ -z "$DB_ID" ]; then
            npx --yes wrangler@latest d1 create ms007-crm --json > /tmp/d1-create.json
            DB_ID=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/d1-create.json','utf8'));const d=x.result||x;process.stdout.write(d.uuid||d.id||d.database_id||'')")
          fi
          if [ -z "$DB_ID" ]; then
            echo "Could not resolve D1 database ID" >&2
            exit 1
          fi
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Build deploy config
        shell: bash
        run: |
          cp wrangler.toml wrangler.deploy.toml
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/${{ steps.d1.outputs.database_id }}/g" wrangler.deploy.toml

      - name: Apply database schema
        run: npx --yes wrangler@latest d1 execute ms007-crm --remote --file=schema.sql --config wrangler.deploy.toml

      - name: Deploy application
        run: npx --yes wrangler@latest deploy --config wrangler.deploy.toml

      - name: Set bootstrap secret
        if: ${{ env.BOOTSTRAP_TOKEN != '' }}
        shell: bash
        run: printf '%s' "$BOOTSTRAP_TOKEN" | npx --yes wrangler@latest secret put BOOTSTRAP_TOKEN --config wrangler.deploy.toml

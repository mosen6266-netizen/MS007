name: Deploy MS007 to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "src/**"
      - "schema.sql"
      - "wrangler.toml"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOOTSTRAP_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN }}

    steps:
      - name: Cloudflare authorization status
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "Cloudflare authorization has not been configured yet."
          echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable deployment."

      - name: Checkout
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: actions/checkout@v4

      - name: Setup Node
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve or create D1 database
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        id: d1
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"             > /tmp/d1-list.json

          DB_ID=$(node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/d1-list.json','utf8'));
          if(!x.success) {
            console.error(JSON.stringify(x.errors||x));
            process.exit(2);
          }
          const d=(x.result||[]).find(v=>v.name==='ms007-crm');
          if(d) process.stdout.write(d.uuid||'');
          NODE
          )

          if [ -z "$DB_ID" ]; then
            curl -fsS               -X POST               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H "Content-Type: application/json"               --data '{"name":"ms007-crm"}'               "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"               > /tmp/d1-create.json

            DB_ID=$(node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/d1-create.json','utf8'));
          if(!x.success) {
            console.error(JSON.stringify(x.errors||x));
            process.exit(2);
          }
          const d=x.result||{};
          process.stdout.write(d.uuid||'');
          NODE
            )
          fi

          if [ -z "$DB_ID" ]; then
            echo "Could not resolve D1 database ID" >&2
            exit 1
          fi

          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Build deploy config
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        shell: bash
        run: |
          cp wrangler.toml wrangler.deploy.toml
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/${{ steps.d1.outputs.database_id }}/g" wrangler.deploy.toml

      - name: Apply database schema
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx --yes wrangler@latest d1 execute ms007-crm --remote --file=schema.sql --config wrangler.deploy.toml

      - name: Deploy application
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx --yes wrangler@latest deploy --config wrangler.deploy.toml

      - name: Set bootstrap secret
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.BOOTSTRAP_TOKEN != '' }}
        shell: bash
        run: printf '%s' "$BOOTSTRAP_TOKEN" | npx --yes wrangler@latest secret put BOOTSTRAP_TOKEN --config wrangler.deploy.toml

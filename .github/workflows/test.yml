name: MS007 Quality Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "src/**"
      - "schema.sql"
      - "migrations/**"
      - "scripts/**"
      - "tests/**"
      - "wrangler.toml"
      - ".github/workflows/test.yml"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check frontend JavaScript syntax
        run: node --check public/app.js

      - name: Check Worker JavaScript syntax
        shell: bash
        run: |
          cp src/worker.js /tmp/worker.mjs
          node --check /tmp/worker.mjs

      - name: Database destructive-change safety gate
        run: node scripts/check-db-safety.mjs

      - name: Check duplicate function declarations
        run: node scripts/check-duplicate-functions.mjs

      - name: Validate fresh database plus migrations
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, sqlite3
          con=sqlite3.connect(":memory:")
          con.execute("PRAGMA foreign_keys=ON")
          con.executescript(pathlib.Path("schema.sql").read_text(encoding="utf-8"))
          for p in sorted(pathlib.Path("migrations").glob("*.sql")):
              con.executescript(p.read_text(encoding="utf-8"))
              print("Applied migration:",p.name)
          print("Fresh schema validation OK")
          PY

      - name: Batch 1 customer integrity regression
        run: python tests/batch1_integrity.py

      - name: Batch 2 referential integrity regression
        run: python tests/batch2_integrity.py

      - name: Batch 3 backup restore V3 regression
        run: python tests/batch3_backup_v3.py

      - name: Batch 4 performance regression
        run: python tests/batch4_performance.py

      - name: Batch 5 draft and Telegram reliability regression
        run: python tests/batch5_reliability.py

      - name: Batch 6 business regression
        run: python tests/batch6_business_regression.py

      - name: Verify bootstrap defaults do not leak into migration files
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE "p_registered|f_phone|sa_dashboard|ss_dashboard" migrations; then
            echo "Default seed records must stay in fresh-database schema only." >&2
            exit 1
          fi
          echo "No bootstrap defaults found in migrations."

      - name: Check required project files
        shell: bash
        run: |
          test -f public/index.html
          test -f public/styles.css
          test -f public/app.js
          test -f src/worker.js
          test -f schema.sql
          test -f wrangler.toml
          test -f scripts/check-db-safety.mjs
          echo "Required files OK"

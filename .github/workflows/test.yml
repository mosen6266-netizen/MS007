name: MS007 Quality Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "src/**"
      - "schema.sql"
      - "migrations/**"
      - "scripts/**"
      - "tests/**"
      - "wrangler.toml"
      - ".github/workflows/test.yml"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check frontend JavaScript syntax
        run: node --check public/app.js

      - name: Check Worker JavaScript syntax
        shell: bash
        run: |
          cp src/worker.js /tmp/worker.mjs
          node --check /tmp/worker.mjs

      - name: Database destructive-change safety gate
        run: node scripts/check-db-safety.mjs

      - name: Validate fresh database plus migrations
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, sqlite3

          con=sqlite3.connect(":memory:")
          con.execute("PRAGMA foreign_keys=ON")
          con.executescript(pathlib.Path("schema.sql").read_text(encoding="utf-8"))

          for p in sorted(pathlib.Path("migrations").glob("*.sql")):
              con.executescript(p.read_text(encoding="utf-8"))
              print("Applied migration:",p.name)

          required={
              "users","sessions","customers","field_definitions","customer_values",
              "progress_definitions","customer_progress","sidebar_items",
              "sidebar_categories","sidebar_item_categories","list_columns",
              "dashboard_widgets","audit_logs","system_settings","telegram_settings",
              "telegram_progress_routes","telegram_delivery_logs","telegram_send_queue",
              "telegram_chat_rate","ms007_migration_guard"
          }
          tables={r[0] for r in con.execute("select name from sqlite_master where type='table'")}
          missing=sorted(required-tables)
          if missing:
              raise SystemExit("Missing tables: "+", ".join(missing))

          guard=con.execute(
              "select guard_value from ms007_migration_guard where guard_key='migration_system'"
          ).fetchone()
          if not guard or guard[0]!="enabled":
              raise SystemExit("Migration baseline marker missing")

          print("Fresh schema + migrations OK. Tables:",len(tables))
          PY

      - name: Batch 1 customer integrity regression
        run: python tests/batch1_integrity.py

      - name: Verify bootstrap defaults do not leak into migration files
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE "p_registered|f_phone|sa_dashboard|ss_dashboard" migrations; then
            echo "Default seed records must stay in fresh-database schema only." >&2
            exit 1
          fi
          echo "No bootstrap defaults found in migrations."

      - name: Check required project files
        shell: bash
        run: |
          test -f public/index.html
          test -f public/styles.css
          test -f public/app.js
          test -f src/worker.js
          test -f schema.sql
          test -f wrangler.toml
          test -f migrations/0000_baseline_migration_system.sql
          test -f scripts/check-db-safety.mjs
          echo "Required files OK"
